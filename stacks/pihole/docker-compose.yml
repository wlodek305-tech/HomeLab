services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80"
    environment:
      TZ: Europe/Warsaw
      WEBPASSWORD: ${PIHOLE_PASSWORD}
    volumes:
      - pihole_data:/etc/pihole
      - dnsmasq_data:/etc/dnsmasq.d
    networks:
      - lab

volumes:
  pihole_data:
  dnsmasq_data:

networks:
  lab:
    external: true
