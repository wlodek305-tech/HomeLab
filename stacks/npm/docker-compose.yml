services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
      - /opt/certs:/opt/certs
    networks:
      - lab

volumes:
  npm_data:
  npm_letsencrypt:

networks:
  lab:
    external: true
